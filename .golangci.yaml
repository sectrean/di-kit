version: "2"
linters:
  enable:
    - asasalint
    - copyloopvar
    - dupword
    - errname
    - gocritic
    - godot
    - gosec
    - intrange
    - nilnil
    - prealloc
    - revive
    - sloglint
    - testifylint
    - testpackage
    - whitespace
  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - deferInLoop
    gosec:
      excludes:
        - G404
        - G114
    govet:
      enable-all: true
    prealloc:
      for-loops: true
    revive:
      rules:
        - name: exported
          arguments:
            - sayRepetitiveInsteadOfStutters
            - checkPublicInterface
    sloglint:
      context: scope
      static-msg: true
    testifylint:
      enable-all: true
      disable:
        - require-error
        - compares
  exclusions:
    rules:
      - linters:
          - revive
        text: ^exported
        paths:
          - internal/...
          - examples/...
      - linters:
          - prealloc
        path: internal/testtypes/...
      - linters:
          - testpackage
        path: lifetime_test.go
formatters:
  enable:
    - gci
    - gofmt
