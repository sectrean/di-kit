name: Go

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Verify the library builds, vets, and tests on the minimum supported Go
  # version declared in go.mod (1.23). Test/benchmark files that use newer
  # stdlib APIs are guarded by //go:build go1.24 / go1.25 constraints and are
  # skipped here. The dev tools (task, golangci-lint, mockery) require a newer
  # Go, so this job runs the go commands directly instead of via Taskfile.
  build-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 10s ./...

  # Full build, lint, test, race, benchmarks, and coverage on the latest Go.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install dev tools
        run: go -C tools install tool

      - name: Build
        run: task build

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Test (race)
        run: task test-race

      - name: Publish coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
