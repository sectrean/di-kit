version: '3'

tasks:
  setup:
    cmds:
      - go mod download -x
      # Dev tools (task, golangci-lint, mockery) live in a separate module
      # under ./tools so they don't pollute the library's dependency graph.
      - go -C tools install tool

  build:
    cmds:
      - go build -v ./...

  test:
    cmds:
      - go test -coverprofile=coverage.txt -timeout 10s -v ./...

  test-race:
    cmds:
      - go test -timeout 60s -race -count 100 ./...

  bench:
    cmds:
      - go test -bench=. -benchmem -run='^$' ./...

  generate:
    cmds:
      - mockery

  lint:
    cmds:
      - golangci-lint config verify
      - golangci-lint run -v
