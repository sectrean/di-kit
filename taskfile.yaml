version: '3'

tasks:
  setup:
    cmds:
      - go mod download -x

  build:
    cmds:
      - go build -v ./...

  test:
    cmds:
      - go test -coverprofile=coverage.txt -timeout 10s -v ./...

  test-race:
    cmds:
      - go test -timeout 30s -race -count 20 -v ./...

  bench:
    cmds:
      - go test -bench=. -benchmem -run='^$' ./...

  generate:
    cmds:
      - mockery

  lint:
    cmds:
      - golangci-lint config verify
      - golangci-lint run -v
